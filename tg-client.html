<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D0B09">
  <title>LUXARCH</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
  <!-- Pagina clientului: fără admin.js și fără rute /api/admin/* -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0D0B09; --bg-2: #15120F; --bg-3: #1D1915;
      --ink: #EFE8DC; --mute: rgba(239, 232, 220, .68); --line: rgba(239, 232, 220, .18);
      --lux: #E9B872; --err: #F09A86;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); overflow-x: hidden; min-height: 100vh;
      /* Zonele sigure: variabilele Telegramului și, în lipsa lor, cele ale browserului */
      padding:
        calc(16px + max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px))
        calc(16px + max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px)))
        calc(24px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)))
        calc(16px + max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px)));
    }
    a { color: var(--lux); }
    button, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--lux); outline-offset: 2px; }
    .page { max-width: 560px; margin: 0 auto; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { font-family: var(--serif); font-size: 1.3rem; letter-spacing: .14em; }
    .lang { display: flex; flex: none; }
    .lang button {
      min-width: 44px; min-height: 44px; background: none; border: 0; border-radius: 8px; cursor: pointer;
      font-size: .82rem; font-weight: 600; color: var(--mute);
    }
    .lang button[aria-pressed="true"] { color: var(--lux); text-decoration: underline; text-underline-offset: 4px; }

    h1 { font-family: var(--serif); font-weight: 300; font-size: 2.2rem; line-height: 1.1; overflow-wrap: anywhere; }
    .who { margin: 8px 0 24px; color: var(--mute); overflow-wrap: anywhere; }
    .who b { color: var(--ink); font-weight: 600; }

    .field { margin-bottom: 24px; border: 0; min-width: 0; }
    .field > label, .field > legend { display: block; margin-bottom: 8px; font-weight: 600; font-size: .95rem; }
    .services { display: grid; gap: 8px; }
    .service { display: block; cursor: pointer; }
    .service input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .service span {
      display: flex; align-items: center; min-height: 48px; padding: 10px 14px; overflow-wrap: anywhere;
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
    }
    .service input:checked + span { border-color: var(--lux); background: var(--bg-3); color: var(--lux); font-weight: 600; }
    .service input:focus-visible + span { outline: 2px solid var(--lux); outline-offset: 2px; }

    .input {
      display: block; width: 100%; min-height: 48px; padding: 11px 14px; font-size: 16px;
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
    }
    textarea.input { min-height: 112px; resize: vertical; }
    .input::placeholder { color: rgba(239, 232, 220, .45); }
    .bad .input, .bad .service span { border-color: var(--err); }
    .hint { margin-top: 6px; font-size: .9rem; color: var(--lux); }
    .err { margin-top: 6px; font-size: .9rem; color: var(--err); }

    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; padding: 10px 16px;
      border-radius: 10px; border: 1px solid var(--lux); background: none; color: var(--lux); font-weight: 600;
      text-align: center; text-decoration: none; cursor: pointer;
    }
    .btn-main { background: var(--lux); color: var(--bg); }
    .btn[disabled] { opacity: .6; cursor: default; }
    #contactBtn { margin-bottom: 10px; }

    .field > label.check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; margin-bottom: 0; font-weight: 400; cursor: pointer; }
    .check input { flex: none; width: 24px; height: 24px; margin-top: 2px; accent-color: var(--lux); }
    .check a { padding-block: 12px; }
    .notice { margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--err); border-radius: 10px; overflow-wrap: anywhere; }
    .notice a { display: inline-block; padding-block: 10px; font-weight: 600; }
    .screen p { margin: 12px 0 24px; color: var(--mute); overflow-wrap: anywhere; }
    .screen .btn + .btn { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <span class="brand">LUXARCH</span>
      <div class="lang" id="lang" role="group" aria-label="Limba / Язык / Language">
        <button type="button" data-lang="ro">RO</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <!-- Deschis într-un browser obișnuit: formularul nu apare -->
    <section class="screen" id="noTg" hidden>
      <h1 data-t="noTgTitle"></h1>
      <p data-t="noTgText"></p>
      <a class="btn btn-main" id="openTg" data-t="noTgBtn"></a>
    </section>

    <form id="form" novalidate hidden>
      <h1 data-t="title"></h1>
      <p class="who"><span data-t="from"></span> <b id="who"></b></p>

      <fieldset class="field" id="f-type">
        <legend data-t="type"></legend>
        <div class="services" id="types"></div>
        <p class="err" id="e-type" hidden></p>
      </fieldset>

      <fieldset class="field" id="f-service">
        <legend data-t="service"></legend>
        <div class="services" id="services"></div>
        <p class="err" id="e-service" hidden></p>
      </fieldset>

      <div class="field" id="f-phone">
        <button class="btn" type="button" id="contactBtn" data-t="contactBtn" hidden></button>
        <label for="phone" data-t="phone"></label>
        <input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30">
        <p class="hint" id="phoneHint" data-t="phoneHint" hidden></p>
        <p class="err" id="e-phone" hidden></p>
      </div>

      <div class="field" id="f-message">
        <label for="message" data-t="message"></label>
        <textarea class="input" id="message" rows="4" maxlength="3000"></textarea>
        <p class="err" id="e-message" hidden></p>
      </div>

      <div class="field" id="f-consent">
        <label class="check">
          <input type="checkbox" id="consent">
          <span><span data-t="consent"></span> <a id="policy" href="/confidentialitate" data-t="policy"></a></span>
        </label>
        <p class="err" id="e-consent" hidden></p>
      </div>

      <div class="notice" id="notice" role="alert" hidden>
        <span id="noticeText"></span>
        <div><a id="noticeWa" href="https://wa.me/37368133945" data-t="whatsapp" hidden></a></div>
      </div>
      <button class="btn btn-main" type="submit" id="send" data-t="send"></button>
    </form>

    <section class="screen" id="done" hidden>
      <h1 data-t="doneTitle"></h1>
      <p id="doneText"></p>
      <button class="btn btn-main" type="button" id="close" data-t="close"></button>
    </section>
  </div>

  <script src="i18n.js"></script>
  <script src="tg-client.js"></script>
</body>
</html>
